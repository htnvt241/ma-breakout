name: 診斷（暫時）
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          m=json.load(urllib.request.urlopen("https://htnvt241.github.io/ma-breakout/data/sim/meta.json"))
          cal=m["cal"]; b=m["bench"]
          print("len", len(cal), len(b), "first", cal[:3], b[:3], "last", cal[-3:], b[-3:])
          for d in [20141231,20150102,20150105,20151231,20181228,20201231,20221230,20241231,20250617,20250618,20251231,20261118,20261119,20261120]:
              print(d, b[cal.index(d)] if d in cal else "not in cal")
          i0=cal.index(20150102); print("ratio", b[-1]/b[i0])
          nn=[cal[i] for i,v in enumerate(b) if v is None]; print("None count", len(nn), nn[:5])
          big=[(cal[i],b[i-1],b[i]) for i in range(1,len(b)) if b[i] and b[i-1] and abs(b[i]/b[i-1]-1)>0.07]; print("big jumps", big[:20])
          PY
